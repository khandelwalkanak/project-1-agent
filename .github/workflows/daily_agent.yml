name: Daily Social Trends Report

on:
  schedule:
    - cron: '30 1 * * *'  # 7:00 AM IST (UTC+5:30) every day
  workflow_dispatch:        # also triggerable manually from GitHub UI

permissions:
  contents: write           # needed to commit the report back to the repo

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run agent
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY:     ${{ secrets.YOUTUBE_API_KEY }}
          TAVILY_API_KEY:      ${{ secrets.TAVILY_API_KEY }}
          GMAIL_SENDER:        ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT:     ${{ secrets.GMAIL_RECIPIENT }}
          GEMINI_MODEL:        gemini-3.8-flash
          MAX_STEPS:           "15"
          TOKEN_BUDGET:        "80000"
        run: uv run python main.py

      - name: Commit report to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ data/social_trends.duckdb
          git diff --staged --quiet || git commit -m "chore: daily report $(date +%Y-%m-%d)"
          git push
