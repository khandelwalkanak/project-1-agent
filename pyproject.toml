[project]
name = "social-trends-agent"
version = "0.1.0"
description = "Agent that finds trending Meta smart glasses content and generates India content ideas"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.9.0",
    "duckdb>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src layout: packages live under src/ but are imported without the src. prefix
sources = ["src"]
