[project]
name = "social-trends-agent"
version = "0.1.0"
description = "Agent that finds trending Meta smart glasses content and generates India content ideas"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=0.8.0",
    "pydantic>=2.9.0",
    "duckdb>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "markdown>=3.7",
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
    "pytrends>=4.9.2",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40.0", "plotly>=5.24.0"]


[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
