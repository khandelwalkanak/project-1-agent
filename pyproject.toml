[project]
name = "social-trends-agent"
version = "0.1.0"
description = "Agent that finds trending Meta smart glasses content and generates India content ideas"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=0.8.0",
    "pydantic>=2.9.0",
    "duckdb>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/tools", "src/storage", "src/prompts"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
